<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD494" />
      <stop offset="100%" stop-color="#F39C12" />
    </linearGradient>
    <linearGradient id="catEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB3B3" />
      <stop offset="100%" stop-color="#FF8A8A" />
    </linearGradient>
  </defs>
  <!-- Background warm circle -->
  <circle cx="100" cy="100" r="90" fill="#FFF7ED" stroke="#FED7AA" stroke-width="4" />
  
  <!-- Cat Ears -->
  <polygon points="50,90 70,36 100,75" fill="url(#catBody)" />
  <polygon points="60,82 72,48 92,72" fill="url(#catEar)" opacity="0.85" />
  
  <polygon points="150,90 130,36 100,75" fill="url(#catBody)" />
  <polygon points="140,82 128,48 108,72" fill="url(#catEar)" opacity="0.85" />
  
  <!-- Cat Head -->
  <ellipse cx="100" cy="115" rx="65" ry="55" fill="url(#catBody)" />
  
  <!-- Cheeks Blush -->
  <circle cx="62" cy="125" r="10" fill="#FFAAA6" opacity="0.4" />
  <circle cx="138" cy="125" r="10" fill="#FFAAA6" opacity="0.4" />
  
  <!-- Eyes -->
  <ellipse cx="75" cy="108" rx="7" ry="9" fill="#2C3E50" />
  <circle cx="73" cy="105" r="3" fill="#FFFFFF" />
  
  <ellipse cx="125" cy="108" rx="7" ry="9" fill="#2C3E50" />
  <circle cx="123" cy="105" r="3" fill="#FFFFFF" />
  
  <!-- Nose -->
  <polygon points="96,120 104,120 100,126" fill="#D35400" />
  
  <!-- Mouth -->
  <path d="M93 128 Q100 134 100 126 Q100 134 107 128" fill="none" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Whiskers -->
  <line x1="45" y1="116" x2="25" y2="112" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />
  <line x1="45" y1="124" x2="23" y2="126" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />
  <line x1="155" y1="116" x2="175" y2="112" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />
  <line x1="155" y1="124" x2="177" y2="126" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />
</svg>
